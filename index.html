<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CI/CD Demo - Pineapple AI</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: white; }
    .card { text-align: center; padding: 2.5rem; background: #1e293b; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; color: #cbd5e1; }
    .badge { background: #22c55e; color: black; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pineapple AI</h1>
    <p>CI/CD Automated Deployment using <b>GitHub Actions</b></p>
    <p><span class="badge">STATUS: UPDATED VIA FEATURE BRANCH</span></p>
  </div>
</body>
</html>
